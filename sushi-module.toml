# What this module is. `hub` reads this when the checkout is in a workspace; when it is
# absent, `hub` falls back to its own catalog entry for a module it already knows.
# The format: docs/reference/MODULE_MANIFEST.md in the SushiStack repository.
#
# `fragment` is omitted: cli/sushistack.deps.toml is the default and where this module
# keeps it.

[module]
name = "sushiruntime"
alias = "sr"
distribution = "source"
repo = "https://github.com/sushisystems/sushiruntime.git"
