name: Set up sr
description: Installs Python, the sr CLI from cli/ and, on Linux, ccache.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"
    - name: python -m pip install -e ./cli
      shell: bash
      run: python -m pip install -e ./cli
    - name: sudo apt-get install -y ccache
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get install -y --no-install-recommends ccache
