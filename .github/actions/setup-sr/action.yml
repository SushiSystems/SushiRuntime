name: Set up sr
description: Installs Python, the sr CLI from cli/, the pinned Sushi libraries with their CLIs and, on Linux, ccache.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"
    - name: python -m pip install -e ./cli
      shell: bash
      run: python -m pip install -e ./cli
    # The Linux jobs run no `sr setup`, so the Sushi libraries cli/sushistack.deps.toml pins are
    # cloned here, beside the checkout, where sushicore looks for a sibling. A clone off the
    # pinned commit fails the step.
    - name: Clone the pinned Sushi libraries beside the checkout
      shell: bash
      run: |
        python - <<'EOF'
        import pathlib, subprocess, sys, tomllib
        root = pathlib.Path.cwd()
        pins = tomllib.loads((root / "cli/sushistack.deps.toml").read_text()).get("sushisystems", {})
        for name, pin in pins.items():
            target = root.parent / name
            if not target.is_dir():
                subprocess.run(["git", "clone", "--depth", "1", "--branch", pin["version"],
                                f"https://github.com/sushisystems/{name}.git", str(target)],
                               check=True)
            head = subprocess.run(["git", "-C", str(target), "rev-parse", "HEAD"], check=True,
                                  capture_output=True, text=True).stdout.strip()
            if head != pin["commit"]:
                raise SystemExit(f"{name} is at {head}; cli/sushistack.deps.toml pins {pin['commit']}")
            # A library package is built by that library's own CLI.
            subprocess.run([sys.executable, "-m", "pip", "install", str(target / "cli")], check=True)
        EOF
    - name: sudo apt-get install -y ccache
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get install -y --no-install-recommends ccache
