name: Set up Intel oneAPI DPC++
description: Installs the DPC++ compiler, the OpenCL CPU device and the build tools on an Ubuntu runner.
runs:
  using: composite
  steps:
    - name: Install the compiler and the build dependencies
      shell: bash
      run: |
        set -e
        wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
          | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
          | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          intel-oneapi-compiler-dpcpp-cpp \
          cmake ninja-build pkg-config git libhwloc-dev libgtest-dev
        source /opt/intel/oneapi/setvars.sh --force
        icpx --version
        sycl-ls
    # sr test restores the shell's LD_LIBRARY_PATH for a oneAPI build (cli/README.md), and the
    # test programs carry no RPATH to the oneAPI runtime, so the job's shell carries its path.
    - name: Export the oneAPI library path
      shell: bash
      run: |
        source /opt/intel/oneapi/setvars.sh --force > /dev/null
        echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
