name: CI

# The pre-merge stage on every pull request; the post-merge stage, which adds ThreadSanitizer
# and SushiBLAS built against this commit, on every push to main and when nightly.yml calls
# this file. Every job runs the project CLI; tests/README.md gives the sizes.
on:
  pull_request:
  push:
    branches: [ main, build/test_sizes ]
  workflow_dispatch:
  workflow_call:
    inputs:
      post_merge:
        description: Run the post-merge jobs as well.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SR_SYCL_TOOLCHAIN: oneapi
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  checks:
    name: Checkers (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: python tools/check_all.py .
        run: python tools/check_all.py .
      - name: python -m unittest discover -s tools/tests
        run: python -m unittest discover -s tools/tests

  cli:
    name: Python CLI
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: python -m pip install pytest pytest-timeout pyflakes -e ./cli
        run: python -m pip install pytest pytest-timeout pyflakes -e ./cli
      - name: python -m pyflakes sushiruntime
        working-directory: cli
        run: python -m pyflakes sushiruntime
      - name: python -m pytest tests -q
        working-directory: cli
        run: python -m pytest tests -q

  linux:
    name: Linux (small, medium)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-oneapi
      - uses: ./.github/actions/setup-sr
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-icpx-release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cli/sushiruntime/services/project.py') }}-${{ github.sha }}
          restore-keys: ccache-linux-icpx-release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cli/sushiruntime/services/project.py') }}-
      - name: sr build --distributed --no-cuda
        run: sr build --distributed --no-cuda
      # Saved even when a later step fails or times out, so the next run starts warm.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .ccache
          key: ccache-linux-icpx-release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cli/sushiruntime/services/project.py') }}-${{ github.sha }}
      - name: sr test --label small
        run: sr test --label small
      - name: sr test --label medium
        run: sr test --label medium

  windows:
    name: Windows (small, medium)
    timeout-minutes: 90
    runs-on: windows-latest
    env:
      SR_SYCL_TOOLCHAIN: intel-llvm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-sr
      - name: choco install ccache
        run: choco install ccache -y --no-progress
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-intel-llvm-release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cli/sushiruntime/services/project.py') }}-${{ github.sha }}
          restore-keys: ccache-windows-intel-llvm-release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cli/sushiruntime/services/project.py') }}-
      # sr setup installs vcpkg, its ports and the intel/llvm bundle under ~/.sushisystems.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sushisystems
          key: sushisystems-windows-${{ hashFiles('cli/sushistack.deps.toml', 'cli/pyproject.toml') }}
      - name: sr setup --yes --no-gpu
        run: sr setup --yes --no-gpu
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ~/.sushisystems
          key: sushisystems-windows-${{ hashFiles('cli/sushistack.deps.toml', 'cli/pyproject.toml') }}
      - name: sr build --distributed --no-cuda
        run: sr build --distributed --no-cuda
      # Saved even when a later step fails or times out, so the next run starts warm.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .ccache
          key: ccache-windows-intel-llvm-release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cli/sushiruntime/services/project.py') }}-${{ github.sha }}
      - name: sr test --label small
        run: sr test --label small
      - name: sr test --label medium
        run: sr test --label medium

  sanitizers:
    name: ASan and UBSan (small)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-oneapi
      - uses: ./.github/actions/setup-sr
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-icpx-asan-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cli/sushiruntime/services/project.py') }}-${{ github.sha }}
          restore-keys: ccache-linux-icpx-asan-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cli/sushiruntime/services/project.py') }}-
      - name: sr build --type asan --distributed
        run: sr build --type asan --distributed
      # Saved even when a later step fails or times out, so the next run starts warm.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .ccache
          key: ccache-linux-icpx-asan-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cli/sushiruntime/services/project.py') }}-${{ github.sha }}
      - name: sr test --asan --label small
        run: sr test --asan --label small

  docs:
    name: API docs site
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-sr
      - name: sudo apt-get install -y doxygen graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen graphviz
      - name: sr docs
        run: sr docs

  gate:
    name: gate
    if: always()
    needs: [checks, cli, linux, windows, sanitizers, docs]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every pre-merge job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"

  thread-sanitizer:
    name: ThreadSanitizer (small, medium)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || inputs.post_merge
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-oneapi
      - uses: ./.github/actions/setup-sr
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-icpx-tsan-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cli/sushiruntime/services/project.py') }}-${{ github.sha }}
          restore-keys: ccache-linux-icpx-tsan-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cli/sushiruntime/services/project.py') }}-
      # The SYCL runtime, oneTBB and the OpenCL CPU device are not instrumented, so TSan reports
      # races inside their own thread pools; this option keeps it to the code built here.
      - name: sr build --type relwithdebinfo --distributed
        run: sr build --type relwithdebinfo --distributed
      # Saved even when a later step fails or times out, so the next run starts warm.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .ccache
          key: ccache-linux-icpx-tsan-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'cli/sushiruntime/services/project.py') }}-${{ github.sha }}
      - name: sr test --label small
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1
        run: sr test --label small
      - name: sr test --label medium
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1
        run: sr test --label medium

  downstream:
    name: SushiBLAS against this commit
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || inputs.post_merge
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiruntime
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiBLAS
          path: sushiblas
      - uses: ./sushiruntime/.github/actions/setup-oneapi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: sudo apt-get install -y ccache
        run: sudo apt-get install -y --no-install-recommends ccache
      - name: python -m pip install -e ./sushiblas/cli
        run: python -m pip install -e ./sushiblas/cli
      # The OpenCL CPU JIT vectorizer crashes on one SushiBLAS kernel; see its KNOWN_ISSUES.md.
      - name: sb build
        working-directory: sushiblas
        shell: bash
        env:
          SB_CXX: icpx
          SB_USE_VCPKG: "false"
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb build
      - name: sb test
        working-directory: sushiblas
        shell: bash
        env:
          CL_CONFIG_CPU_VECTORIZER_MODE: "1"
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb test
