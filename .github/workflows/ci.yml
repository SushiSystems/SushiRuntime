name: CI

# Functional suite on every push / PR (fast, deterministic, benchmarks skipped).
# Heavy benchmark suite only on the nightly schedule.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC nightly

jobs:
  functional:
    name: Functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Intel oneAPI DPC++
        uses: ./.github/actions/setup-oneapi

      - name: Configure, build, and run functional suite
        shell: bash
        run: |
          set -e
          source /opt/intel/oneapi/setvars.sh --force
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_CXX_FLAGS=-fsycl \
            -DSR_BUILD_TESTS=ON \
            -DSR_ENABLE_DISTRIBUTED=ON \
            -DSR_BUILD_BENCHMARKS=OFF
          cmake --build build
          ctest --test-dir build -L "unit|integration|regression" --output-on-failure

  sanitizers:
    name: ThreadSanitizer (data races)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Intel oneAPI DPC++
        uses: ./.github/actions/setup-oneapi

      - name: Build + run the unit/integration suite under TSan
        shell: bash
        run: |
          set -e
          source /opt/intel/oneapi/setvars.sh --force
          # RelWithDebInfo trips the auto-TSan gate in cmake/Sanitizers.cmake on the
          # non-MSVC toolchain, instrumenting the whole tree. The concurrency suite
          # (EBR fences, per-worker polling, epoch nesting) is exactly what TSan
          # catches; distributed ON so its threads are covered too.
          cmake -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_CXX_FLAGS=-fsycl \
            -DSR_BUILD_TESTS=ON \
            -DSR_ENABLE_DISTRIBUTED=ON \
            -DSR_BUILD_BENCHMARKS=OFF
          cmake --build build-tsan
          # ignore_noninstrumented_modules: the Intel SYCL runtime, oneTBB and the
          # OpenCL host device (libsycl / libtbb / libintelocl) are linked
          # uninstrumented, so TSan cannot reason about their internal
          # synchronization and reports false races inside their own thread pools
          # (host-task pool cv, TBB worker memcpy). This flag scopes TSan to our
          # instrumented code, where the races we actually own live.
          TSAN_OPTIONS="halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1" \
            ctest --test-dir build-tsan -L "unit|integration|regression" --output-on-failure

  cli:
    name: Python CLI (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip pytest pyflakes
          python -m pip install -e ./cli

      - name: Import-safety check (no crash outside a checkout)
        working-directory: cli
        # pyflakes catches undefined names / bad imports without running anything.
        run: python -m pyflakes sushiruntime || true

      - name: Run CLI unit tests
        working-directory: cli
        run: python -m pytest tests -q

  docs:
    name: API docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Build the fluent API reference
        shell: bash
        run: |
          set -e
          mkdir -p build/docs/api-site
          doxygen .config/doxygen/Doxyfile
          # Surface any undocumented public symbol or missing @param. Reported,
          # not yet fatal: once the log is clean across the public api/ surface,
          # flip this to `exit 1` so the reference can never regress.
          log=build/docs/api-site/doxygen-warnings.log
          if [ -s "$log" ]; then
            echo "::warning::Doxygen reported documentation gaps in the public API:"
            cat "$log"
          fi

      - name: Upload the generated site
        uses: actions/upload-artifact@v4
        with:
          name: api-site
          path: build/docs/api-site/html
          retention-days: 3

  benchmark:
    name: Benchmark suite (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Intel oneAPI DPC++
        uses: ./.github/actions/setup-oneapi

      - name: Configure, build, and run benchmark suite
        shell: bash
        run: |
          set -e
          source /opt/intel/oneapi/setvars.sh --force
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_CXX_FLAGS=-fsycl \
            -DSR_BUILD_TESTS=ON \
            -DSR_BUILD_BENCHMARKS=ON
          cmake --build build
          # Benchmarks self-gate via sanity_gate(); they assert no deadlock /
          # forward progress, not a latency threshold.
          ctest --test-dir build -L "stress|performance" --output-on-failure

  checkers:
    name: Checkers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: python tools/documentation/check_source_comments.py .
        run: python tools/documentation/check_source_comments.py .
      - name: python tools/documentation/check_docs_layout.py .
        run: python tools/documentation/check_docs_layout.py .
      - name: python tools/documentation/check_changelog.py .
        run: python tools/documentation/check_changelog.py .
      - name: python tools/layering/check_layering.py .
        run: python tools/layering/check_layering.py .
      - name: python -m unittest discover -s tools/tests
        run: python -m unittest discover -s tools/tests
