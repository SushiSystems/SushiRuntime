name: Feature Request
description: Propose a new feature or enhancement for SushiRuntime
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to SushiRuntime!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - scheduler (work stealing / dispatch)
        - memory (USM pool / EBR)
        - graph (TaskGraph / dependency tracker)
        - execution (RuntimeContext / engine)
        - topology (discovery / NUMA)
        - distributed (master / worker / transport)
        - CLI / build / installer
        - new component / other
    validations:
      required: true
