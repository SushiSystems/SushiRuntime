name: Bug report
description: Report a defect in SushiRuntime
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please give us enough to reproduce it.
        For **security** issues do NOT use this form — see .github/SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest reproducer you can manage, including the exact command.
      placeholder: |
        1. sr build --type asan
        2. sr run sr_functional_tests -- --gtest_filter='...'
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - scheduler (work stealing / dispatch)
        - memory (USM pool / EBR)
        - graph (TaskGraph / dependency tracker)
        - execution (RuntimeContext / engine)
        - topology (discovery / NUMA)
        - distributed (master / worker / transport)
        - CLI / build / installer
        - other / not sure
    validations:
      required: true
  - type: input
    id: build-config
    attributes:
      label: Build configuration
      placeholder: "Release | Debug | asan ; --distributed ; CUDA on/off"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, SYCL toolchain (intel-llvm / adaptivecpp / oneapi), CMake version, GPU, commit hash.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      render: shell
