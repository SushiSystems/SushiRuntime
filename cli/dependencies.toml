# SushiRuntime dependency manifest — the single source of truth for what the
# `sr setup` installer pulls in.
#
# Each top-level table is one dependency. The installer reads this file, gathers
# the package names for the active platform, checks what is already present, and
# installs only the missing ones. No dependency name lives in the installer code.
#
# Adding a new dependency:
#   1. Add a table here (linux_apt + windows_vcpkg, optional check_cmd).
#   2. If the C++ build needs it, also add the find_package/pkg_check_modules
#      call in CMakeLists.txt (that is build logic, intentionally out of scope
#      for this manifest).
#   3. If the Docker image needs it, also add it to the Dockerfile apt line.
#
# Field reference:
#   description    Human-readable purpose (shown by `sr setup detect`).
#   required       false => a missing one warns but does not stop the build.
#   gpu_only       true  => only installed when `--gpu` is passed.
#   linux_apt      apt package names; empty list = not needed on Linux.
#   windows_vcpkg  vcpkg port names; empty list = not needed on Windows.
#   check_cmd      Optional command; exit 0 means "already installed" (idempotency).
#                  Use "{name}" tokens? No — keep it a literal argv list.

[build_tools]
description   = "C++ compiler and core build tools (gcc, g++, make). Any GCC >= 9 suffices for the intel-llvm -fsycl host pass."
required      = true
linux_apt     = ["build-essential"]
windows_vcpkg = []

[cmake]
# Windows: installed via winget (Kitware.CMake) by install.ps1 — cmake cannot
# bootstrap itself through vcpkg, and vcpkg itself requires cmake to run.
description   = "CMake build system. 3.20+ for intel-llvm / AdaptiveCpp; 3.25+ required for the oneAPI toolchain."
required      = true
linux_apt     = ["cmake"]
windows_vcpkg = []
check_cmd     = ["cmake", "--version"]

[ninja]
# Windows: installed via winget (Ninja-build.Ninja) by install.ps1.
description   = "Ninja build generator (default generator on both platforms via config.toml)."
required      = true
linux_apt     = ["ninja-build"]
windows_vcpkg = []
check_cmd     = ["ninja", "--version"]

[hwloc]
description   = "Hardware locality library (topology / NUMA discovery)"
required      = true
linux_apt     = ["libhwloc-dev"]
windows_vcpkg = ["hwloc"]
check_cmd     = ["pkg-config", "--exists", "hwloc"]

[gtest]
description   = "GoogleTest (unit / integration test framework)"
required      = true
linux_apt     = ["libgtest-dev"]
windows_vcpkg = ["gtest"]

[opencl]
description   = "OpenCL ICD loader + dev headers (exposes CPU as a SYCL device)"
required      = true
linux_apt     = ["ocl-icd-opencl-dev", "ocl-icd-libopencl1"]
windows_vcpkg = ["opencl"]
check_cmd     = ["pkg-config", "--exists", "OpenCL"]

[pkgconf]
description   = "pkg-config implementation (CMake uses it to locate hwloc)"
required      = true
linux_apt     = ["pkg-config"]
windows_vcpkg = ["pkgconf"]
check_cmd     = ["pkg-config", "--version"]

[adaptivecpp]
description   = "AdaptiveCpp (acpp) — secondary SYCL toolchain. Built from source / distro package; not in vcpkg."
required      = false
linux_apt     = []
windows_vcpkg = []
check_cmd     = ["acpp", "--version"]

[cuda]
# Ubuntu apt ships nvidia-cuda-toolkit 11.x, which is incompatible with the
# intel/llvm nightly bundle (requires CUDA 12.x). Install from NVIDIA's official
# runfile or use the nvidia/cuda Docker base image — do not rely on apt here.
description   = "NVIDIA CUDA toolkit (SYCL nvptx64 backend; arch via SR_CUDA_ARCH, default 61). Must be installed from NVIDIA's official runfile, not Ubuntu apt (apt ships CUDA 11.x)."
required      = false
gpu_only      = true
linux_apt     = []
windows_vcpkg = []
check_cmd     = ["nvcc", "--version"]
