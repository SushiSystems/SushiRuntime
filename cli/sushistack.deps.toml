# SushiRuntime dependency fragment — the dependencies the runtime itself owns,
# declared in the runtime repo (under cli/) so they travel with it and can be
# reasoned about standalone. `hub` aggregates this with the SushiStack base
# fragment when the runtime is part of the workspace (cloned in, or registered
# via `hub link`), then downloads everything into the shared dependencies/ tree.
#
# The SYCL toolchains live here, not in SushiStack's base, because they exist
# *because of the runtime*: SushiRuntime is the SYCL program. SushiStack itself
# has no SYCL/compute dependencies — it only provisions what the modules declare.
#
# Field reference:
#   description    Human-readable purpose (shown by `hub doctor`).
#   required       false => a missing one warns but does not stop the build.
#   provides       Capability tag; deps sharing one are interchangeable any-of
#                  alternatives for readiness (any one present => satisfied).
#   gpu_only       true  => only installed when GPU support is requested.
#   linux_apt      apt package names; empty list = not an apt/vcpkg package.
#   windows_vcpkg  vcpkg port names; empty list = not an apt/vcpkg package.
#   check_cmd      Optional command; exit 0 means "already installed".
#
# Toolchains with empty package lists (intel-llvm, adaptivecpp, oneapi, cuda) are
# not apt/vcpkg ports — `hub install` fetches them with its toolchain installer.
# They appear here so the dependency picture is complete and `hub`
# report them as the runtime's dependencies.

[hwloc]
description   = "Hardware locality library (topology / NUMA discovery). The runtime links it for the hardware topology layer."
required      = true
linux_apt     = ["libhwloc-dev"]
windows_vcpkg = ["hwloc"]
check_cmd     = ["pkg-config", "--exists", "hwloc"]

[intel-llvm]
description   = "intel/llvm SYCL toolchain (clang++ -fsycl), the primary SYCL compiler. Fetched as a nightly bundle by hub install."
required      = true
provides      = "sycl-toolchain"
linux_apt     = []
windows_vcpkg = []

[adaptivecpp]
description   = "AdaptiveCpp (acpp) — secondary SYCL toolchain. Built from source / distro package; not in vcpkg."
required      = true
provides      = "sycl-toolchain"
linux_apt     = []
windows_vcpkg = []
check_cmd     = ["acpp", "--version"]

[oneapi]
description   = "Intel oneAPI DPC++ compiler (icx/icpx) — heavy third SYCL toolchain (several GB)."
required      = true
provides      = "sycl-toolchain"
linux_apt     = []
windows_vcpkg = []

[cuda]
# Ubuntu apt ships nvidia-cuda-toolkit 11.x, which is incompatible with the
# intel/llvm nightly bundle. sushicore installs the release this machine's cards
# need from NVIDIA's redistributable archives instead; do not rely on apt here.
description   = "NVIDIA CUDA toolkit (SYCL nvptx64 backend; arch via SR_CUDA_ARCH, which has no default and is resolved from nvidia-smi). The release is chosen per machine: the newest one the driver runs whose nvcc builds for every card, so Pascal gets 12.x. From NVIDIA's redistributable archives, not Ubuntu apt."
required      = false
gpu_only      = true
linux_apt     = []
windows_vcpkg = []
check_cmd     = ["nvcc", "--version"]

[module]
depends_on = ["sushilog", "sushiprofiler"]
# The CLI sushicore runs to build and package this library for a consumer: `sr build --lean`,
# then `sr package --no-archive`.
cli = "sr"

# SushiLog, the one logger of the process. sushicore builds its package, or reuses a built one,
# at this tag and the CLI hands the package to CMake as SushiLog_DIR.
[sushisystems.sushilog]
version = "v0.2.3"
commit  = "5f714a7bca6cad1a49e9a6133e75f0f791dba551"

# SushiProfiler, the stack's profiler. sushicore resolves it the same way and the CLI hands the
# package to CMake as SushiProfiler_DIR.
[sushisystems.sushiprofiler]
version = "v0.3.0"
commit  = "e6e9b8af059d26f4084bbef3de902907df2a04ae"
