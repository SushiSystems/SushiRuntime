[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sushiruntime-cli"
version = "1.0.0"
description = "SushiRuntime developer CLI (build / test / run / docker)"
authors = [{ name = "Mustafa Garip", email = "mustafagarip@sushisystems.io" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
sr = "sushiruntime.cli:app"
sushiruntime = "sushiruntime.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sushiruntime*"]

# The CLI always runs from inside a checkout (every command resolves the repo
# root via find_project_root), so the dependency manifest is read straight from
# the repo's cli/dependencies.toml — there is no need to ship it in the wheel.

[tool.setuptools.package-data]
sushiruntime = ["py.typed"]
