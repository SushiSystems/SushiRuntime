[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sushiruntime-cli"
version = "1.0.0"
description = "SushiRuntime developer CLI (build / test / run / docker)"
authors = [{ name = "Mustafa Garip", email = "mustafagarip@sushisystems.io" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "sushicore==0.9.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
sr = "sushiruntime.cli:main"
sushiruntime = "sushiruntime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sushiruntime*"]

# The CLI always runs from inside a checkout (every command resolves the repo
# root via find_project_root), so the dependency manifest is read straight from
# the repo's cli/sushistack.deps.toml — there is no need to ship it in the wheel.

[tool.setuptools.package-data]
sushiruntime = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "small: one process and one thread, no network, no sleep, no file outside the build tree (60 s)",
    "medium: threads and processes, localhost, files in a temporary folder (300 s)",
    "large: real hardware, or a run longer than medium allows (900 s)",
    "quarantined: an intermittent test, out of every gating stage; see docs/reference/KNOWN_ISSUES.md",
]
